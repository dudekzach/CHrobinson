  .ava-header-vertical { font-size: 12px; color: #64748b; margin-top: 3px; }
  .ava-header-meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .ava-header-right { text-align: right; }
  .ava-header-right .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; }
  .ava-header-right .agent-id { font-size: 11px; color: #475569; }
  .ava-header-right .slug { font-size: 10px; color: #94a3b8; margin-top: 4px; }
  .id-row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }

  .tab-btn { padding: 7px 16px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; color: #475569; font-weight: 600; font-size: 12px; cursor: pointer; transition: all .15s; font-family: inherit; }

  .badge-sm { font-size: 10px; padding: 1px 6px; }

  .filter-btn.active { background: #0f172a; border-color: #0f172a; color: #fff; }

  .scenario:hover { box-shadow: 0 2px 8px rgba(0,0,0,.07); }

  .scenario-header.open { background: var(--cat-bg); }

  .scenario-title { font-weight: 700; font-size: 13px; color: #0f172a; }
  .scenario-chevron { color: #94a3b8; font-size: 13px; transition: transform .2s; }
  .scenario-chevron.open { transform: rotate(180deg); }
  .scenario-body { padding: 14px 16px; border-top: 1px solid rgba(0,0,0,.06); background: var(--cat-bg); display: none; }
  .scenario-body.open { display: block; }

  .field-block { margin-bottom: 12px; }

  /* ── Code blocks ── */
  .code-block { background: #0f172a; border-radius: 6px; padding: 9px 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  .utterance-block { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 9px 13px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead tr { background: #f1f5f9; }
  th { padding: 9px 14px; text-align: left; font-weight: 700; color: #475569; border-bottom: 2px solid #e2e8f0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  td { padding: 9px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }
  td code { font-size: 11px; color: #1e293b; }

  @media (max-width: 640px) { .cap-grid { grid-template-columns: 1fr; } }
  .cap-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
  .cap-section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .cap-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 9px; }
  .cap-dot { font-size: 10px; margin-top: 3px; flex-shrink: 0; }
  .cap-text { font-size: 13px; color: #334155; line-height: 1.45; }

  .mock-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 14px; }
  .mock-field { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; }
  .mock-value { font-size: 15px; font-weight: 800; color: #0f172a; margin-top: 5px; }

  .section-label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }

  /* ── Hidden ── */
  .hidden { display: none !important; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
</style>

const CATEGORIES = {
  "happy-path":   { label:"Happy Path",          color:"#16a34a", bg:"#f0fdf4" },
  "knowledge-only":{ label:"Knowledge Only",     color:"#2563eb", bg:"#eff6ff" },
  "negative":     { label:"Negative Path",        color:"#dc2626", bg:"#fef2f2" },
  "error":        { label:"Error / Resilience",  color:"#d97706", bg:"#fffbeb" },
  "escalation":   { label:"Escalation",           color:"#7c3aed", bg:"#f5f3ff" },
  "guardrail":    { label:"Guardrail",            color:"#475569", bg:"#f8fafc" }
};

const TOOL_COLORS = {
  "Knowledge":    { bg:"#eff6ff", text:"#1d4ed8" },
  "Data Action":  { bg:"#fef9c3", text:"#a16207" }
};

let currentAva = "principal";
let currentTab = "scenarios";
let currentFilter = "all";

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = "✓ Copied";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = orig; btn.classList.remove("copied"); }, 1500);
  });
}

function badge(text, color, bg, extraClass="") {
  return `<span class="badge ${extraClass}" style="color:${color};background:${bg}">${text}</span>`;
}

function copyBtn(text, label="Copy") {
  const escaped = text.replace(/"/g, '&quot;').replace(/'/g, "&#39;");
  return `<button class="copy-btn" onclick="copyText('${escaped}', this)">${label}</button>`;
}

function codeBlock(value) {
  return `<div class="code-block"><code>${value}</code>${copyBtn(value)}</div>`;
}

function renderNav() {
  const nav = document.getElementById("avaNav");
  nav.innerHTML = Object.values(AVA_DATA).map(a =>
    `<button class="ava-nav-btn ${a.id===currentAva?'active':''}" style="--accent:${a.accent}"
      onclick="selectAva('${a.id}')">${a.name.split(" ").slice(0,3).join(" ")}</button>`
  ).join("");
}

function selectAva(id) {
  currentAva = id;
  currentTab = "scenarios";
  currentFilter = "all";
  renderNav();
  renderMain();
}

function selectTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab===tab));
  document.querySelectorAll(".tab-pane").forEach(p => p.classList.toggle("hidden", p.dataset.pane!==tab));
}

function setFilter(cat) {
  currentFilter = cat;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.cat===cat));
  document.querySelectorAll(".scenario").forEach(s => {
    if (cat==="all" || s.dataset.cat===cat) s.style.display="";
    else s.style.display="none";
  });
}

function toggleScenario(id) {
  const hdr = document.getElementById("sh-"+id);
  const body = document.getElementById("sb-"+id);
  const chev = document.getElementById("sc-"+id);
  const open = body.classList.contains("open");
  body.classList.toggle("open", !open);
  hdr.classList.toggle("open", !open);
  chev.classList.toggle("open", !open);
}

function renderScenarios(ava) {
  const cats = [...new Set(ava.scenarios.map(s=>s.category))];
  const total = ava.scenarios.length;

  const filterBar = `<div class="filter-bar">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" data-cat="all" onclick="setFilter('all')">All (${total})</button>
    ${cats.map(cat=>{
      const m=CATEGORIES[cat]||{}; const count=ava.scenarios.filter(s=>s.category===cat).length;
      return `<button class="filter-btn" data-cat="${cat}" style="color:${m.color}" onclick="setFilter('${cat}')">${m.label} (${count})</button>`;
    }).join("")}
  </div>`;

  const cards = ava.scenarios.map(s => {
    const cat = CATEGORIES[s.category]||{};
    const reliableBadge = s.reliable===false
      ? badge("⚠ Eval Caution","#d97706","#fffbeb","badge-sm")
      : badge("✓ Reliable","#16a34a","#f0fdf4","badge-sm");

    const flowPills = s.flow.map((f,i)=>`
      <span style="display:flex;align-items:center;gap:4px">
        ${badge(f,"#475569","#f8fafc")}
        ${i<s.flow.length-1?'<span class="flow-arrow">→</span>':''}
      </span>`).join("");

    const actorNote = s.actorNote ? `<div class="actor-note"><strong>ACTOR NOTE: </strong><span>${s.actorNote}</span></div>` : "";
    const evalNote = s.reliableNote ? `<div class="eval-note"><strong>EVAL NOTE: </strong><span>${s.reliableNote}</span></div>` : "";

    return `<div class="scenario" data-cat="${s.category}">
      <div class="scenario-header" id="sh-${s.id}" onclick="toggleScenario('${s.id}')">
        <div class="scenario-header-left">
          ${badge(cat.label,cat.color,cat.bg)}
          <span class="scenario-title">${s.label}</span>
          ${reliableBadge}
        </div>
        <span class="scenario-chevron" id="sc-${s.id}">▼</span>
      </div>
      <div class="scenario-body" id="sb-${s.id}" style="--cat-bg:${cat.bg}">
        ${s.persona ? `<div class="field-block"><div class="field-label">Persona</div><div style="font-size:13px;color:#334155">${s.persona}</div></div>` : ""}
        <div class="field-block"><div class="field-label">Start Context</div>${codeBlock(s.context||"{}")}</div>
        <div class="field-block"><div class="field-label">Sample Utterance</div>
          <div class="utterance-block"><span class="utterance-text">"${s.utterance}"</span>${copyBtn(s.utterance)}</div>
        </div>
        <div class="field-block"><div class="field-label">Tool Call Flow</div><div class="flow-row">${flowPills}</div></div>
        <div class="field-block"><div class="field-label">Expected Outcome</div><div class="expected-text">${s.expected}</div></div>
        ${actorNote}${evalNote}
      </div>
    </div>`;
  }).join("");

  return filterBar + cards;
}

function renderPersonas(ava) {
  const cards = ava.personas.map(p=>`
    <div class="persona-card">
      <div><div class="persona-name">${p.name}</div><div class="persona-detail">${p.detail}</div></div>
      <div class="persona-id-col">
        <span class="persona-id-code mono">${p.id}</span>
        ${copyBtn(p.id)}
      </div>
    </div>`).join("");

  let extra = "";
  if (ava.mockData) {
    extra = `<div style="margin-top:18px"><div class="section-label">Elm Street Mock Values (Robert Miller — Primary POV)</div>
      <div class="mock-grid">${ava.mockData.map(d=>`
        <div class="mock-card"><div class="mock-field">${d.field}</div><div class="mock-value">${d.value}</div></div>`).join("")}
      </div></div>`;
  }
  return `<div class="section-label">Demo Personas & Credentials</div>${cards}${extra}`;
}

function renderTools(ava) {
  const rows = ava.tools.map(t=>{
    const tc = TOOL_COLORS[t.type]||{bg:"#f1f5f9",text:"#475569"};
    return `<tr><td><code>${t.name}</code></td>
      <td>${badge(t.type,tc.text,tc.bg)}</td>
      <td style="color:#475569">${t.purpose}</td></tr>`;
  }).join("");
  return `<div class="tools-table-wrap"><table>
    <thead><tr><th>Tool</th><th>Type</th><th>Purpose</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderCapabilities(ava) {
  const inScope = ava.capabilities.map(c=>`<div class="cap-item"><span class="cap-dot" style="color:#16a34a">●</span><span class="cap-text">${c}</span></div>`).join("");
  const outScope = ava.outOfScope.map(c=>`<div class="cap-item"><span class="cap-dot" style="color:#dc2626">●</span><span class="cap-text">${c}</span></div>`).join("");
  return `<div class="cap-grid">
    <div class="cap-card"><div class="cap-section-label" style="color:#16a34a">✓ In Scope</div>${inScope}</div>
    <div class="cap-card"><div class="cap-section-label" style="color:#dc2626">✗ Out of Scope</div>${outScope}</div>
  </div>`;
}

function renderOrders(ava) {
  if (!ava.orders) return "";
  return `<div class="section-label">Demo Order Catalog</div>` + ava.orders.map(o=>`
    <div class="order-card">
      <div class="order-top">
        <div class="order-badges">
          <code style="font-size:12px;font-weight:700">${o.number}</code>
          ${badge(o.type,"#64748b","#f1f5f9")}
          ${badge(o.statusLabel,o.statusColor,o.statusBg)}
        </div>
        ${copyBtn(o.number)}
      </div>
      ${o.detail ? `<div class="order-detail">${o.detail}</div>` : ""}
      ${o.missing ? `<div class="order-missing">${o.missing}</div>` : ""}
      ${o.note ? `<div class="order-note">${o.note}</div>` : ""}
    </div>`).join("");
}

function renderMain() {
  const ava = AVA_DATA[currentAva];
  const tabs = [
    { id:"scenarios", label:"Scenarios" },
    { id:"personas",  label:"Personas & Data" },
    { id:"tools",     label:"Tools" },
    { id:"capabilities", label:"Capabilities" },
    ...(ava.orders ? [{ id:"orders", label:"Orders" }] : [])
  ];

  const tabBtns = tabs.map(t=>
    `<button class="tab-btn ${t.id===currentTab?'active':''}" data-tab="${t.id}" onclick="selectTab('${t.id}')">${t.label}</button>`
  ).join("");

  const tabPanes = tabs.map(t=>{
    let content = "";
    if (t.id==="scenarios") content = renderScenarios(ava);
    else if (t.id==="personas") content = renderPersonas(ava);
    else if (t.id==="tools") content = renderTools(ava);
    else if (t.id==="capabilities") content = renderCapabilities(ava);
    else if (t.id==="orders") content = renderOrders(ava);
    return `<div class="tab-pane ${t.id!==currentTab?'hidden':''}" data-pane="${t.id}">${content}</div>`;
  }).join("");

  const statusColor = ava.statusColor || "#2563eb";
  const statusBg = statusColor + "18";

  document.getElementById("mainContent").innerHTML = `
    <!-- AVA Header -->
    <div class="ava-header" style="--accent:${ava.accent}">
      <div>
        <div class="ava-header-name">${ava.name}</div>
        <div class="ava-header-vertical">${ava.vertical}</div>
        <div class="ava-header-meta">
          ${ava.channel.map(c=>badge(c,ava.accent,ava.accent+"1a")).join("")}
          ${badge(ava.status,statusColor,statusBg)}
          ${badge(ava.version,"#475569","#f1f5f9")}
        </div>
      </div>
      <div class="ava-header-right">
        <div class="label">Agent ID</div>
        <div class="id-row"><span class="agent-id mono">${ava.agentId}</span>${copyBtn(ava.agentId)}</div>
        <div class="slug mono">slug: ${ava.slug}</div>
      </div>
    </div>
    <!-- Tabs -->
    <div class="tabs" style="--accent:${ava.accent}">${tabBtns}</div>
    <!-- Panes -->
    ${tabPanes}
  `;
}

// Init
renderNav();
renderMain();
</script>
